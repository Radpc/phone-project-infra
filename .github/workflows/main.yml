name: "MAIN DEPLOY"

on:
  push:
    branches:
      - main

# Permission can be added at job level or workflow level
permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: prod
      aws-assume-role-arn: "arn:aws:iam::769774122370:role/github-actions-radpc-pipeline"
      aws-region: "sa-east-1"
      aws-statefile-s3-bucket: "radpc-sa-east-1-terraform-statefile"
      aws-lock-dynamodb-table: "radpc-sa-east-1-terraform-lock"
